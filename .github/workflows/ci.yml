name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, and format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Expo and React Native currently require npm's legacy peer resolution.
      - name: Install standalone mobile dependencies
        working-directory: apps/mobile
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Lint
        id: lint
        continue-on-error: true
        run: pnpm lint

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: pnpm typecheck

      - name: Check formatting
        id: format
        continue-on-error: true
        run: pnpm format:check

      - name: Report quality gate
        if: always()
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
        run: |
          if [[ "$LINT_OUTCOME" != "success" || "$TYPECHECK_OUTCOME" != "success" || "$FORMAT_OUTCOME" != "success" ]]; then
            echo "Quality checks: lint=$LINT_OUTCOME, typecheck=$TYPECHECK_OUTCOME, format=$FORMAT_OUTCOME"
            exit 1
          fi

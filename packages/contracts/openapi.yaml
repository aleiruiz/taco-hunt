        avatarPhotoStatus: { type: [string, "null"], enum: [pending, approved, rejected] }
    ProfilePatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        displayName: { type: [string, "null"], minLength: 1, maxLength: 60 }
        avatarPreset: { $ref: "#/components/schemas/AvatarPreset" }
        avatarPhotoUploadId: { type: [string, "null"], format: uuid }
    ProgressBadge:

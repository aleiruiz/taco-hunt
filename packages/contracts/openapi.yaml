        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Fotos aprobadas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpotPhotoListResponse" }
        "404": { $ref: "#/components/responses/ApiError" }
    post:
      operationId: createSpotPhoto
      summary: Asocia una foto ya subida (POST /v1/review-photos) a un puesto (T37/T39)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpotPhotoCreate" }
      responses:
        "201":
          description: Foto pendiente de moderación
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpotPhoto" }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
  /v1/admin/spot-photos/{id}/approve:
    post:
      operationId: approveSpotPhoto
      summary: Aprueba una foto de puesto pendiente (T37/T38)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Foto aprobada }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
  /v1/admin/spot-photos/{id}/reject:
    post:
      operationId: rejectSpotPhoto
      summary: Rechaza una foto de puesto pendiente (T37/T38)
      security: [{ bearerAuth: [] }]

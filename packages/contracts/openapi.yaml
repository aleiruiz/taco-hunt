  /v1/me/progress:
    get:
      operationId: getMyProgress
      summary: Progreso de retos e insignias propio (T49, swaps T48 fixture)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Progreso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgressResponse" }
        "401": { $ref: "#/components/responses/ApiError" }
  /v1/admin/import-candidates:
    get:
      operationId: listImportCandidates
      summary: Lista candidatos de importación pendientes (T42, swaps T50 fixture)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: state, schema: { type: string, enum: [pending, approved, rejected] } }
      responses:
        "200":
          description: Candidatos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportCandidateListResponse" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
  /v1/admin/import-candidates/{id}/approve:
    post:
      operationId: approveImportCandidate
      summary: Convierte un candidato en puesto publicado (T42)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportCandidateApprove" }
      responses:
        "200": { description: Candidato aprobado y publicado }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
  /v1/admin/import-candidates/{id}/reject:
    post:
      operationId: rejectImportCandidate
      summary: Rechaza un candidato de importación (T42)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportCandidateReject" }
      responses:
        "200": { description: Candidato rechazado }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
  /v1/admin/import-candidates/{id}/merge:
    post:
      operationId: mergeImportCandidate
      summary: Fusiona un candidato con un puesto existente (T42)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportCandidateMerge" }
      responses:
        "200": { description: Candidato fusionado }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ApiError:
      description: Error con identificador de solicitud
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    ServiceUnavailable:
      description: Servicio no disponible temporalmente
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              {
                type: string,
                enum:
                  [
                    VALIDATION_ERROR,
                    UNAUTHORIZED,
                    FORBIDDEN,
                    NOT_FOUND,
                    CONFLICT,
                    RATE_LIMITED,
                    SERVICE_UNAVAILABLE,
                    INTERNAL_ERROR,
                  ],
              }
            message: { type: string }
            requestId: { type: string }
            details: { type: object, additionalProperties: true }
    TacoType:
      type: object
      required: [id, slug, nameEs]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        nameEs: { type: string }
    TacoSummary:
      type: object
      required: [id, tacoTypeId, name, score, reviewCount]
      properties:
        id: { type: string, format: uuid }
        tacoTypeId: { type: string, format: uuid }
        name: { type: string }
        score: { type: [number, "null"], minimum: 1, maximum: 5 }
        reviewCount: { type: integer, minimum: 0 }
    PublicReview:
      type: object
      required:
        [
          id,
          tacoTypeId,
          tacoName,
          displayName,
          tortilla,
          filling,
          salsa,
          value,
          score,
          pricePaidMxn,
          body,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        tacoTypeId: { type: string, format: uuid }
        tacoName: { type: string }
        displayName: { type: [string, "null"] }
        tortilla: { type: integer, minimum: 1, maximum: 5 }
        filling: { type: integer, minimum: 1, maximum: 5 }
        salsa: { type: integer, minimum: 1, maximum: 5 }
        value: { type: integer, minimum: 1, maximum: 5 }
        score: { type: number, minimum: 1, maximum: 5 }
        pricePaidMxn: { type: [number, "null"], minimum: 0 }
        body: { type: [string, "null"], maxLength: 500 }
        createdAt: { type: string, format: date-time }
    ReviewPhotoAccess:
      type: object
      required: [url, expiresIn]
      properties:
        url: { type: string, format: uri }
        expiresIn: { type: integer, const: 300 }
    ReviewPhotoUpload:
      type: object
      required: [id, contentType, sizeBytes]
      properties:
        id: { type: string, format: uuid }
        contentType: { const: image/webp }
        sizeBytes: { type: integer, minimum: 1, maximum: 307200 }
    SpotSummary:
      type: object
      required: [id, name, neighborhood, latitude, longitude, lastVerifiedAt, reviewCount, bestTaco]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        neighborhood: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        lastVerifiedAt: { type: [string, "null"], format: date-time }
        reviewCount: { type: integer, minimum: 0 }
        bestTaco: { oneOf: [{ $ref: "#/components/schemas/TacoSummary" }, { type: "null" }] }
    SpotDetail:
      type: object
      required:
        [id, name, neighborhood, latitude, longitude, lastVerifiedAt, reviewCount, tacos, reviews]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        neighborhood: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        lastVerifiedAt: { type: [string, "null"], format: date-time }
        reviewCount: { type: integer, minimum: 0 }
        tacos: { type: array, items: { $ref: "#/components/schemas/TacoSummary" } }
        reviews:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/PublicReview" }
    ReviewCreate:
      type: object
      required: [spotTacoId, tortilla, filling, salsa, value]
      additionalProperties: false
      properties:
        spotTacoId: { type: string, format: uuid }
        tortilla: { type: integer, minimum: 1, maximum: 5 }
        filling: { type: integer, minimum: 1, maximum: 5 }
        salsa: { type: integer, minimum: 1, maximum: 5 }
        value: { type: integer, minimum: 1, maximum: 5 }
        pricePaidMxn: { type: number, minimum: 0, maximum: 10000 }
        body: { type: string, maxLength: 500 }
        photoUploadId: { type: string, format: uuid }
    ReviewPatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        tortilla: { type: integer, minimum: 1, maximum: 5 }
        filling: { type: integer, minimum: 1, maximum: 5 }
        salsa: { type: integer, minimum: 1, maximum: 5 }
        value: { type: integer, minimum: 1, maximum: 5 }
        pricePaidMxn: { type: [number, "null"], minimum: 0, maximum: 10000 }
        body: { type: [string, "null"], maxLength: 500 }
        photoUploadId: { oneOf: [{ type: string, format: uuid }, { type: "null" }] }
    ReviewWriteResult:
      type: object
      required:
        [
          id,
          spotTacoId,
          tortilla,
          filling,
          salsa,
          value,
          score,
          pricePaidMxn,
          body,
          status,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        spotTacoId: { type: string, format: uuid }
        tortilla: { type: integer, minimum: 1, maximum: 5 }
        filling: { type: integer, minimum: 1, maximum: 5 }
        salsa: { type: integer, minimum: 1, maximum: 5 }
        value: { type: integer, minimum: 1, maximum: 5 }
        score: { type: number, minimum: 1, maximum: 5 }
        pricePaidMxn: { type: [number, "null"], minimum: 0 }
        body: { type: [string, "null"], maxLength: 500 }
        status: { type: string, enum: [visible, hidden] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OwnReview:
      type: object
      required:
        [
          id,
          spotTacoId,
          spotId,
          spotName,
          neighborhood,
          tacoTypeId,
          tacoName,
          tortilla,
          filling,
          salsa,
          value,
          score,
          pricePaidMxn,
          body,
          status,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        spotTacoId: { type: string, format: uuid }
        spotId: { type: [string, "null"], format: uuid }
        spotName: { type: string }
        neighborhood: { type: string }
        tacoTypeId: { type: [string, "null"], format: uuid }
        tacoName: { type: string }
        tortilla: { type: integer, minimum: 1, maximum: 5 }
        filling: { type: integer, minimum: 1, maximum: 5 }
        salsa: { type: integer, minimum: 1, maximum: 5 }
        value: { type: integer, minimum: 1, maximum: 5 }
        score: { type: number, minimum: 1, maximum: 5 }
        pricePaidMxn: { type: [number, "null"], minimum: 0 }
        body: { type: [string, "null"], maxLength: 500 }
        status: { type: string, enum: [visible, hidden] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OwnReviewPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/OwnReview" } }
        nextCursor: { type: [string, "null"], maxLength: 512 }
    Favorite:
      allOf:
        - $ref: "#/components/schemas/SpotSummary"
        - type: object
          required: [favoritedAt]
          properties:
            favoritedAt: { type: string, format: date-time }
    FavoritePage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Favorite" } }
        nextCursor: { type: [string, "null"], maxLength: 512 }
    SpotProposal:
      type: object
      required: [name, neighborhood, latitude, longitude]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        neighborhood: { type: string, minLength: 2, maxLength: 120 }
        latitude: { type: number, minimum: 25, maximum: 27 }
        longitude: { type: number, minimum: -101.5, maximum: -99 }
        note: { type: string, maxLength: 500 }
        source: { type: string, enum: [manual, autocomplete], default: manual }
        sourceRef: { type: string, minLength: 1, maxLength: 200 }
    SpotProposalResult:
      type: object
      required: [id, name, neighborhood, latitude, longitude, status, createdAt, nearbyCandidates]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        neighborhood: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        status: { const: pending }
        createdAt: { type: string, format: date-time }
        nearbyCandidates:
          { type: array, items: { $ref: "#/components/schemas/NearbySpotCandidate" } }
    SpotProposalStatus:
      type: object
      required: [id, name, neighborhood, latitude, longitude, status, createdAt, note]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        neighborhood: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        status: { type: string, enum: [pending, approved, rejected] }
        createdAt: { type: string, format: date-time }
        note: { type: [string, "null"], maxLength: 500 }
    NearbySpotCandidate:
      type: object
      required: [id, name, neighborhood, latitude, longitude, distanceMeters, match]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        neighborhood: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        distanceMeters: { type: integer, minimum: 0, maximum: 100 }
        match: { type: string, enum: [strong, nearby] }
    TacoProposal:
      type: object
      required: [spotId, tacoTypeId]
      additionalProperties: false
      properties:
        spotId: { type: string, format: uuid }
        tacoTypeId: { type: string, format: uuid }
        displayName: { type: string, minLength: 1, maxLength: 80 }
    TacoProposalResult:
      type: object
      required: [id, spotId, tacoTypeId, displayName, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        spotId: { type: string, format: uuid }
        tacoTypeId: { type: string, format: uuid }
        displayName: { type: [string, "null"] }
        status: { const: pending }
        createdAt: { type: string, format: date-time }
    TacoProposalStatus:
      type: object
      required: [id, spotId, spotName, tacoTypeId, name, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        spotId: { type: string, format: uuid }
        spotName: { type: string }
        tacoTypeId: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        createdAt: { type: string, format: date-time }
    ReportCreate:
      type: object
      required: [targetType, targetId, reason]
      additionalProperties: false
      properties:
        targetType: { type: string, enum: [spot, review] }
        targetId: { type: string, format: uuid }
        reason: { type: string, enum: [inaccurate, abusive, spam, closed, other] }
        note: { type: string, maxLength: 500 }
    ReportResult:
      type: object
      required: [id, targetType, targetId, reason, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        targetType: { type: string, enum: [spot, review] }
        targetId: { type: string, format: uuid }
        reason: { type: string, enum: [inaccurate, abusive, spam, closed, other] }
        status: { const: open }
        createdAt: { type: string, format: date-time }
    DuplicateCandidate:
      type: object
      required: [id, name, neighborhood, latitude, longitude, distanceMeters, match]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        neighborhood: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        distanceMeters: { type: integer, minimum: 0 }
        match: { type: string, enum: [strong, nearby] }
    ModerationReason:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 1, maxLength: 500, pattern: '\S' }
    ModerationReasonOptional:
      type: object
      additionalProperties: false
      properties:
        reason:
          {
            type: string,
            minLength: 1,
            maxLength: 500,
            pattern: '\S',
            default: "Acción de moderación",
          }
    SpotApproval:
      type: object
      additionalProperties: false
      properties:
        confirmOwnFields: { type: boolean }
        name: { type: string, minLength: 1, maxLength: 120 }
        neighborhood: { type: string, minLength: 1, maxLength: 120 }
        latitude: { type: number, minimum: 25, maximum: 27 }
        longitude: { type: number, minimum: -101.5, maximum: -99 }
        sourceType: { type: string, enum: [user, owner, licensed, fictional] }
        sourceRef: { type: string, minLength: 1, maxLength: 200 }
        verifiedAt: { type: string, format: date-time }
        verificationNote: { type: string, minLength: 1, maxLength: 500 }
    SpotApprovalResult:
      type: object
      required: [id, status, sourceType, lastVerifiedAt, approvedBy, approvedAt, verifiedBy]
      properties:
        id: { type: string, format: uuid }
        status: { const: approved }
        sourceType: { type: string, enum: [user, owner, licensed, fictional] }
        sourceRef: { type: [string, "null"], maxLength: 200 }
        lastVerifiedAt: { type: string, format: date-time }
        approvedBy: { type: string, format: uuid }
        approvedAt: { type: string, format: date-time }
        verifiedBy: { type: string, format: uuid }
        verificationNote: { type: [string, "null"], maxLength: 500 }
    ModerationAuditEntry:
      type: object
      required: [id, moderatorId, targetType, targetId, action, createdAt, reason]
      properties:
        id: { type: string, format: uuid }
        moderatorId: { type: [string, "null"], format: uuid }
        targetType: { type: string }
        targetId: { type: string, format: uuid }
        action: { type: string }
        createdAt: { type: string, format: date-time }
        reason: { type: [string, "null"], maxLength: 500 }
    # --- T51: consolidated from Phase A Data needs ---
    MapPin:
      type: object
      required: [id, name, neighborhood, latitude, longitude, bestTaco]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        neighborhood: { type: string }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        bestTaco: { type: [string, "null"] }
    MapCluster:
      type: object
      required: [count, latitude, longitude, bounds]
      properties:
        count: { type: integer, minimum: 1 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        bounds:
          type: object
          required: [north, south, east, west]
          properties:
            north: { type: number, minimum: -90, maximum: 90 }
            south: { type: number, minimum: -90, maximum: 90 }
            east: { type: number, minimum: -180, maximum: 180 }
            west: { type: number, minimum: -180, maximum: 180 }
    MapPinsResponse:
      type: object
      required: [pins, clusters]
      properties:
        pins: { type: array, items: { $ref: "#/components/schemas/MapPin" } }
        clusters: { type: array, items: { $ref: "#/components/schemas/MapCluster" } }
    SearchColoniaSuggestion:
      type: object
      required: [id, name, municipality, spotCount]
      properties:
        id: { type: string }
        name: { type: string }
        municipality: { type: string }
        spotCount: { type: integer, minimum: 0 }
    SearchPuestoSuggestion:
      type: object
      required: [id, name, neighborhood, bestTaco, reviewCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        neighborhood: { type: string }
        bestTaco: { type: [string, "null"] }
        reviewCount: { type: integer, minimum: 0 }
    SearchSuggestResponse:
      type: object
      required: [colonias, puestos]
      properties:
        colonias: { type: array, items: { $ref: "#/components/schemas/SearchColoniaSuggestion" } }
        puestos: { type: array, items: { $ref: "#/components/schemas/SearchPuestoSuggestion" } }
    SpotPhoto:
      type: object
      required: [id, url, uploaderId, uploaderName, kind, status, rejectionReason, createdAt]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        uploaderId: { type: string, format: uuid }
        uploaderName: { type: string }
        kind: { type: string, enum: [tacos, puesto, menu] }
        status: { type: string, enum: [pending, approved, rejected] }
        rejectionReason: { type: [string, "null"], maxLength: 500 }
        createdAt: { type: string, format: date-time }
    PublicSpotPhoto:
      type: object
      required: [id, url, uploaderName, kind, createdAt]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        uploaderName: { type: string }

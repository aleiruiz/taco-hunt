      properties:
        badges: { type: array, items: { $ref: "#/components/schemas/ProgressBadge" } }
        nextChallenge:
          type: [object, "null"]
          required: [badgeId, label, current, target]
          properties:
            badgeId:
              {
                type: string,
                enum: [recien-llegado, primera-mordida, pionero, explorador, cazador, fotografo],
              }
            label: { type: string }
            current: { type: integer, minimum: 0 }
            target: { type: integer, minimum: 1 }
    ImportCandidateMatch:
      type: object
      required: [spotId, spotName, distanceMeters]
      properties:
        spotId: { type: string, format: uuid }
        spotName: { type: string }
        distanceMeters: { type: number, minimum: 0 }
    ImportCandidate:
      type: object
      required:
        [
          id,
          normalizedName,
          originalName,
          address,
          latitude,
          longitude,
          source,
          sourceRef,
          licenseRef,
          importBatchId,
          matches,
          state,
          reviewNotes,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        normalizedName: { type: string }
        originalName: { type: string }
        address: { type: string }
        latitude: { type: number, minimum: 25, maximum: 27 }
        longitude: { type: number, minimum: -101.5, maximum: -99 }
        source: { type: string }
        sourceRef: { type: string }
        licenseRef: { type: string }
        importBatchId: { type: string, format: uuid }
        matches: { type: array, items: { $ref: "#/components/schemas/ImportCandidateMatch" } }
        state: { type: string, enum: [pending, approved, rejected] }
        reviewNotes: { type: [string, "null"], maxLength: 1000 }
        createdAt: { type: string, format: date-time }
    ImportCandidateListResponse:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ImportCandidate" } }
    ImportCandidateApprove:
      type: object
      required: [latitude, longitude]
      additionalProperties: false
      properties:
        latitude: { type: number, minimum: 25, maximum: 27 }
        longitude: { type: number, minimum: -101.5, maximum: -99 }
    ImportCandidateReject:
      type: object

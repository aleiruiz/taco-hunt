        createdAt: { type: string, format: date-time }
    SpotPhotoListResponse:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PublicSpotPhoto" } }
    SpotPhotoCreate:
      type: object
      required: [photoUploadId]

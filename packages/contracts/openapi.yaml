openapi: 3.1.0
info:
  title: Taco Hunt API
  version: 1.0.0
  description: Contrato HTTP del API Taco Hunt. Las rutas de escritura requieren autenticación.
servers:
  - url: http://localhost:3001
paths:
  /healthz:
    get:
      operationId: health
      summary: Estado del API y conexión de base de datos
      responses:
        "200":
          description: API disponible
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: ok }
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /s/{id}:
    get:
      operationId: shareSpotPreview
      summary: Vista HTML pública para compartir un puesto aprobado
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Vista HTML con metadatos Open Graph y enlace a la aplicación
          content:
            text/html:
              schema: { type: string }
        "404":
          $ref: "#/components/responses/ApiError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/taco-types:
    get:
      operationId: listTacoTypes
      summary: Lista los tipos de taco activos
      responses:
        "200":
          description: Tipos activos
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TacoType" }
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/spots:
    get:
      operationId: listSpots
      summary: Busca puestos aprobados dentro de un área
      description: Results are ordered by distance from the bounding-box center, then normalized name and UUID. The opaque keyset cursor contains this full sort tuple; preserve all filters and bounds while paging. The effective bounding box is capped at 9,000 km².
      parameters:
        - { in: query, name: north, schema: { type: number, minimum: 25, maximum: 27 } }
        - { in: query, name: south, schema: { type: number, minimum: 25, maximum: 27 } }
        - { in: query, name: east, schema: { type: number, minimum: -101.5, maximum: -99 } }
        - { in: query, name: west, schema: { type: number, minimum: -101.5, maximum: -99 } }
        - { in: query, name: q, schema: { type: string, maxLength: 100 } }
        - { in: query, name: tacoType, schema: { type: string, maxLength: 80 } }
        - {
            in: query,
            name: cursor,
            description: Opaque keyset cursor returned by the previous page. Keep query filters and bounds unchanged between pages.,
            schema: { type: string, maxLength: 512 },
          }
        - {
            in: query,
            name: limit,
            schema: { type: integer, minimum: 1, maximum: 50, default: 20 },
          }
      responses:
        "200":
          description: Puestos y cursor siguiente
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/SpotSummary" } }
                  nextCursor: { type: [string, "null"], maxLength: 512 }
        "400":
          $ref: "#/components/responses/ApiError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/spots/{id}:
    get:
      operationId: getSpot
      summary: Obtiene un puesto aprobado y sus tacos
      description: Includes aggregate visible-review counts and up to five recent visible reviews. Pending or rejected stands return 404.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Puesto aprobado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpotDetail" }
        "400":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/spots/{id}/reviews:
    get:
      operationId: listSpotReviews
      summary: Lista reseñas visibles de un puesto aprobado
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - { in: query, name: tacoType, schema: { type: string } }
        - {
            in: query,
            name: cursor,
            description: Opaque descending keyset cursor returned by the previous page. Keep the tacoType filter unchanged between pages.,
            schema: { type: string, maxLength: 512 },
          }
        - {
            in: query,
            name: limit,
            schema: { type: integer, minimum: 1, maximum: 30, default: 20 },
          }
      responses:
        "200":
          description: Reseñas visibles y cursor siguiente
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PublicReview" }
                  nextCursor: { type: [string, "null"], maxLength: 512 }
        "400": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
  /v1/media/{id}:
    get:
      operationId: getVisibleReviewPhoto
      summary: Emite una URL temporal para una foto de reseña visible
      description: La revisión debe estar visible y asociada a un puesto y tipo de taco aprobados. Fotos ocultas o no disponibles responden 404.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: URL de lectura firmada con vigencia limitada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewPhotoAccess" }
        "404": { $ref: "#/components/responses/ApiError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/review-photos:
    post:
      operationId: uploadReviewPhoto
      summary: Valida, procesa y almacena una foto de reseña privada
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Foto procesada temporal y privada; el ID solo puede reclamarse una vez
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewPhotoUpload" }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/reviews:
    post:
      operationId: createReview
      summary: Crea una reseña autenticada
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewCreate" }
      responses:
        "201":
          description: Reseña creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewWriteResult" }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/reviews/{id}:
    patch:
      operationId: updateOwnReview
      summary: Edita una reseña propia
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewPatch" }
      responses:
        "200":
          description: Reseña actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewWriteResult" }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      operationId: deleteOwnReview
      summary: Elimina una reseña propia; repetir la operación es seguro
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Reseña eliminada o ya inexistente }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/me/reviews:
    get:
      operationId: listOwnReviews
      summary: Lista el historial propio de reseñas, incluidas las ocultas
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            in: query,
            name: cursor,
            description: Cursor opaco descendente retornado en la página anterior.,
            schema: { type: string, maxLength: 512 },
          }
        - {
            in: query,
            name: limit,
            schema: { type: integer, minimum: 1, maximum: 50, default: 20 },
          }
      responses:
        "200":
          description: Historial propio y cursor siguiente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnReviewPage" }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/me/favorites:
    get:
      operationId: listOwnFavorites
      summary: Lista favoritos que siguen aprobados y públicos
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            in: query,
            name: cursor,
            description: Cursor opaco descendente retornado en la página anterior.,
            schema: { type: string, maxLength: 512 },
          }
        - {
            in: query,
            name: limit,
            schema: { type: integer, minimum: 1, maximum: 50, default: 20 },
          }
      responses:
        "200":
          description: Favoritos y cursor siguiente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FavoritePage" }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/me/favorites/{spotId}:
    put:
      operationId: addOwnFavorite
      summary: Guarda un puesto aprobado como favorito de forma idempotente
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: spotId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Favorito guardado o ya existente }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      operationId: removeOwnFavorite
      summary: Elimina un favorito de forma idempotente
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: spotId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Favorito eliminado o ya inexistente }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/spot-proposals:
    post:
      operationId: proposeSpot
      summary: Propone un puesto autenticado (implementación T09)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpotProposal" }
      responses:
        "201":
          description: Propuesta pendiente y posibles puestos cercanos para revisar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpotProposalResult" }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
  /v1/taco-proposals:
    post:
      operationId: proposeTaco
      summary: Propone un tipo de taco para un puesto aprobado
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TacoProposal" }
      responses:
        "201":
          description: Propuesta pendiente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TacoProposalResult" }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
  /v1/me/proposals:
    get:
      operationId: listMyProposals
      summary: Lista las propuestas propias de puestos y tacos
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Propuestas del usuario autenticado
          content:
            application/json:
              schema:
                type: object
                required: [spotProposals, tacoProposals]
                properties:
                  spotProposals:
                    { type: array, items: { $ref: "#/components/schemas/SpotProposalStatus" } }
                  tacoProposals:
                    { type: array, items: { $ref: "#/components/schemas/TacoProposalStatus" } }
        "401": { $ref: "#/components/responses/ApiError" }
  /v1/reports:
    post:
      operationId: createReport
      summary: Reporta un puesto o reseña
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportCreate" }
      responses:
        "201":
          description: Reporte agregado a la cola privada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportResult" }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
  /v1/admin/queue:
    get:
      operationId: getModerationQueue
      summary: Obtiene la cola privada de moderación
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            in: query,
            name: kind,
            required: true,
            schema: { type: string, enum: [spots, tacos, reports] },
          }
      responses:
        "200":
          description: Elementos pendientes de moderación
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
  /v1/admin/duplicate-candidates:
    get:
      operationId: findDuplicateCandidates
      summary: Busca puestos aprobados cercanos para revisar un posible duplicado
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            in: query,
            name: name,
            required: true,
            schema: { type: string, minLength: 2, maxLength: 120 },
          }
        - {
            in: query,
            name: latitude,
            required: true,
            schema: { type: number, minimum: 25, maximum: 27 },
          }
        - {
            in: query,
            name: longitude,
            required: true,
            schema: { type: number, minimum: -101.5, maximum: -99 },
          }
      responses:
        "200":
          description: Candidatos públicos cercanos, sin propuestas pendientes ni datos de autores
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DuplicateCandidate" }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
  /v1/admin/audit:
    get:
      operationId: listModerationAudit
      summary: Consulta el historial privado de acciones administrativas
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            in: query,
            name: limit,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
        - {
            in: query,
            name: before,
            description: Cursor opaco devuelto por la página anterior,
            schema: { type: string, maxLength: 512 },
          }
      responses:
        "200":
          description: Acciones recientes y cursor anterior
          content:
            application/json:
              schema:
                type: object
                required: [items, nextBefore]
                properties:
                  items:
                    { type: array, items: { $ref: "#/components/schemas/ModerationAuditEntry" } }
                  nextBefore: { type: [string, "null"], maxLength: 512 }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
  /v1/admin/spot-proposals/{id}/approve:
    post:
      operationId: approveSpotProposal
      summary: Aprueba un puesto propuesto
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpotApproval" }
      responses:
        "200":
          description: Puesto aprobado con procedencia y verificación registradas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpotApprovalResult" }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
  /v1/admin/spot-proposals/{id}/reject:
    post:
      operationId: rejectSpotProposal
      summary: Rechaza un puesto propuesto y conserva un motivo interno
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModerationReason" }
      responses:
        "200": { description: Puesto rechazado }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
  /v1/admin/taco-proposals/{id}/approve:
    post:
      operationId: approveTacoProposal
      summary: Aprueba un tipo de taco propuesto
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Tipo de taco aprobado }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
  /v1/admin/taco-proposals/{id}/reject:
    post:
      operationId: rejectTacoProposal
      summary: Rechaza un tipo de taco propuesto y conserva un motivo interno
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModerationReason" }
      responses:
        "200": { description: Tipo de taco rechazado }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
  /v1/admin/reviews/{id}/hide:
    post:
      operationId: hideReview
      summary: Oculta una reseña de las respuestas públicas
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModerationReasonOptional" }
      responses:
        "200": { description: Reseña oculta }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
  /v1/admin/reviews/{id}/unhide:
    post:
      operationId: unhideReview
      summary: Vuelve a mostrar una reseña
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModerationReasonOptional" }
      responses:
        "200": { description: Reseña visible }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
  /v1/admin/reports/{id}/close:
    post:
      operationId: closeReport
      summary: Cierra un reporte después de su revisión
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModerationReasonOptional" }
      responses:
        "200": { description: Reporte cerrado }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
  # --- T51: consolidated from Phase A Data needs, unimplemented until the
  # noted Phase B task builds the handler. ---
  /v1/spots/map:
    get:
      operationId: getSpotMapPins
      summary: Pines compactos para el viewport visible del mapa (T33/T34)
      description: Sin límite geográfico de dónde puede estar el viewport; un límite por solicitud (~300) devuelve clusters de cuadrícula en vez de truncar silenciosamente.
      parameters:
        - {
            in: query,
            name: north,
            required: true,
            schema: { type: number, minimum: -90, maximum: 90 },
          }
        - {
            in: query,
            name: south,
            required: true,
            schema: { type: number, minimum: -90, maximum: 90 },
          }
        - {
            in: query,
            name: east,
            required: true,
            schema: { type: number, minimum: -180, maximum: 180 },
          }
        - {
            in: query,
            name: west,
            required: true,
            schema: { type: number, minimum: -180, maximum: 180 },
          }
        - { in: query, name: tacoType, schema: { type: string, maxLength: 80 } }
      responses:
        "200":
          description: Pines y/o clusters del viewport
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapPinsResponse" }
        "400": { $ref: "#/components/responses/ApiError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/search/suggest:
    get:
      operationId: searchSuggest
      summary: Sugerencias de colonias y puestos para el buscador (T35/T52)
      description: Sin límite de área; ordenado por proximidad cuando se da `near`. Mínimo 2 caracteres, límite ~8 por sección, sin llamadas a Google.
      parameters:
        - {
            in: query,
            name: q,
            required: true,
            schema: { type: string, minLength: 2, maxLength: 100 },
          }
        - { in: query, name: near, schema: { type: string, description: "'latitud,longitud'" } }
      responses:
        "200":
          description: Colonias y puestos coincidentes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchSuggestResponse" }
        "400": { $ref: "#/components/responses/ApiError" }
        "429": { $ref: "#/components/responses/ApiError" }
  /v1/spots/{id}/photos:
    get:
      operationId: listSpotPhotos
